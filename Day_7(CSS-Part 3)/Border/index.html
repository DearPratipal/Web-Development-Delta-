<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Border Properties</title>
</head>
<body>
    <h2>Border Properties</h2>

    <!-- Border Shorthand -->
     <!-- Use to set an element's border -->

    <!--
     - Width: 1px, 2px, 3px, 4px, 5px, 6px, 7px, 8px, 9px, 10px
     - Style: solid, dashed, dotted, double, groove, ridge, inset, outset
     - Color: red, green, blue, black, white, yellow, cyan, magenta, gray, orange
    -->

    <div>
        This is a paragraph with a height of 100px.
    </div>
    
    <div>
        This is a paragraph with a width of 200px.
    </div>
    
    <H1>Thank You! Bhaya Ji ❤️</H1>

    <!-- Border Sides -->
    <div class="border-top">
        This is a paragraph with a border on the top side.
    </div>
</body>
</html>
