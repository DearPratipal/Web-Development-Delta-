<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height & Width</title>
</head>
<body>
    <!-- Height -->
    <!-- By default, It sets the content areaheight of the element -->
    <div>
        <!-- height: 100px; -->
        <p style="height: 100px; background-color: lightblue;">
            This is a paragraph with a height of 100px.
            </p>
    </div>
   
    <!-- Width -->
    <!-- By default, It sets the content area width of the element -->
    <div>
        <!-- width: 200px; -->
         <p style="width: 200px; background-color: lightgreen;">
            This is a paragraph with a width of 200px.
            </p>
    </div>
    
    
</body>
</html>
